version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint 10 breaks eslint-config-next's bundled eslint-plugin-react
      # (TypeError: contextOrFilename.getFilename is not a function).
      # Stay on 9.x until eslint-plugin-react ships ESLint 10 compatibility.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # `typescript` is an alias for @typescript/typescript6, because
      # typescript-eslint throws on TS 7 (it has no compiler API yet). TS 7's
      # own `tsc` lives under the @typescript/native alias. Keep `typescript`
      # on 6.x until typescript-eslint supports TS 7 (typescript-eslint#10940).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      next:
        patterns:
          - next
          - '@next/*'
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      wix:
        patterns:
          - '@wix/*'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
      typescript:
        patterns:
          - typescript
          - '@typescript/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
        exclude-patterns:
          - eslint-config-next

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
